<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skat Scoresheet</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:12px}label{display:block;margin:6px 0 2px}input,select,button{padding:6px;margin:4px}#out{white-space:pre;font-family:monospace;background:#f7f7f7;padding:10px;border-radius:6px;min-height:160px}table{border-collapse:collapse;width:100%;margin-bottom:8px}th,td{border:1px solid #ddd;padding:6px;text-align:left}thead th{background:#f0f0f0;font-weight:700}tbody tr:nth-child(odd){background:#fafafa}.hand-grid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.hand-col{flex:1 1 48%;min-width:260px}.hand-row{display:flex;gap:8px;align-items:center}.hand-row label{margin:0 8px 0 0;min-width:110px}input[type=number],select,input[type=text]{width:120px}/* hide numeric spinners */input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}#hand .controls{margin-top:8px}.muted{color:#666}#houseRules{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:8px 16px;margin:8px 0 12px}#houseRules label{display:flex;align-items:flex-start;gap:8px;margin:0;min-height:24px}#houseRules input{margin:2px 0 0}</style></head><body><h2>Skat Scoresheet</h2><div id="initArea">
  <div id="setupFields">
    <label>Players</label><select id="players"><option>3</option><option selected>4</option></select>
    <div id="names"><input id="n0" maxlength="8" value="P1"><input id="n1" maxlength="8" value="P2"><input id="n2" maxlength="8" value="P3"><input id="n3" maxlength="8" value="P4"></div>
  </div>
  <div id="houseRules">

    <label><input type="checkbox" id="hr_kontrare"> Allow Kontra/Re</label>
    <label><input type="checkbox" id="hr_nobody_bids_18"> Play Ramsch if nobody bids 18</label>
    <label><input type="checkbox" id="hr_ramsch_after_bock"> Play Ramsch round after Bock round</label>

    <label><input type="checkbox" id="hr_bock_schneider"> Create Bock round for Schneider</label>
    <label><input type="checkbox" id="hr_bock_schneider_only_if_not_bock"> Only create Schneider Bock if not currently a Bock</label>

  </div>
  <div><button id="init">Init Game</button></div>
</div>
<div><button id="add">Add Hand</button></div><hr><div id="hand" style="display:none" class="hand-section">

    </div>
  </div>
</div>

  <div id="out" style="display:none">No output</div>
  <script>class G{constructor(){this.Contract={CLUBS:12,SPADES:11,HEARTS:10,DIAMONDS:9,NULLL:23,GRAND:24,RAMSCH:1};this.Other={NO:0,HAND:1,OPEN:2,SCHNEIDER:4,SCHN_ANNC:8,SCHWARZ:16,SCHW_ANNC:32};this.KR={SINGLE:1,KONTRA:2,RE:4};this.RS={PLAIN:-1,JUNGF:-2,DURCHMARSCH:99};this.Win={LOSE:-2,WIN:1};this.Bock={NO:1,BOCK:2};this.SCORE_NULL_PLAIN=23;this.SCORE_NULL_HAND=35;this.SCORE_NULL_OPEN=46;this.SCORE_NULL_HAND_OPEN=59;this.numPlayers=4;this.names=["P1","P2","P3","P4"];this.hand=[];this.current=0;this.total=[0,0,0,0];this.bock_count=0;this.bock_active=0;this.no_bock_count=0;this.ramsch_count=0;this.bock_starts=[];this.rules={kontrare_allowed:false,nobody_bids_18_play_ramsch:false,ramschround_after_bockround:false,grand_hand_during_ramschround:false,bockround_for_60_60_tie:false,bockround_for_120_hand_score:false,bockround_for_lost_contra_or_rekontra:false,bockround_for_schneider:false,bockround_for_schneider_only_if_not_bockround:false,bockround_max_one_per_hand:false,bockround_if_two_rounds_without_bock:false,bockround_can_be_created_in_grand_during_ramsch:false};}make(){return{declarer:0,bid:0,contract:this.Contract.RAMSCH,winlose:this.Win.LOSE,multipliers:0,matadors:1,overbid:0,loser:[0,0,0],number_of_losers:0,cardpoints:0,kontrare:this.KR.SINGLE,ramsch:this.RS.PLAIN,bock:this.Bock.NO,score:[0,0,0,0],edited:0,grand_during_ramsch:false,takealltricks:false}}refreshBockFlags(){let active=0;for(let i=0;i<this.hand.length;i++){let isBock=false;for(const start of this.bock_starts){if(i>start && i<=start+3){isBock=true;break;}}this.hand[i].bock=isBock?this.Bock.BOCK:this.Bock.NO;if(isBock) active++;}this.bock_active=active;}markNextBockRound(baseIndex){this.bock_starts.push(baseIndex);this.refreshBockFlags();}calculate_suit_grand_score(i){let m=this.hand[i].multipliers;let bits=(m>>>0).toString(2).replace(/0/g,'').length;return this.hand[i].contract*(this.hand[i].matadors+this.hand[i].overbid+bits+1);}calculate_new_bocks(h){let new_bocks=0;if(!this.hand[h].grand_during_ramsch || this.rules.bockround_can_be_created_in_grand_during_ramsch){if((this.hand[h].contract!==this.Contract.RAMSCH)&&(this.hand[h].contract!==this.Contract.NULLL)&&this.rules.bockround_for_120_hand_score){if((this.hand[h].matadors+1)*this.hand[h].contract>=120) new_bocks+=this.numPlayers;}if((this.hand[h].contract!==this.Contract.RAMSCH)&&(this.hand[h].contract!==this.Contract.NULLL)&&this.rules.bockround_for_60_60_tie){if(this.hand[h].cardpoints===60) new_bocks+=this.numPlayers;}if(this.rules.bockround_for_lost_contra_or_rekontra){if(this.hand[h].kontrare===this.KR.RE) new_bocks+=this.numPlayers; else if((this.hand[h].kontrare===this.KR.KONTRA)&&(this.hand[h].winlose===this.Win.LOSE)) new_bocks+=this.numPlayers;}if(this.rules.bockround_for_schneider){if(this.rules.bockround_for_schneider_only_if_not_bockround){if(this.bock_active===0 && (this.hand[h].multipliers & this.Other.SCHNEIDER)) new_bocks+=this.numPlayers;} else if(this.hand[h].multipliers & this.Other.SCHNEIDER) new_bocks+=this.numPlayers;}if(this.rules.bockround_if_two_rounds_without_bock){if(this.no_bock_count===this.numPlayers*2 && new_bocks===0) new_bocks=this.numPlayers;}if(this.rules.bockround_max_one_per_hand && new_bocks>this.numPlayers) new_bocks=this.numPlayers;}
  return new_bocks;}calculate_win_lose(i){let h=this.hand[i];if(h.takealltricks) h.multipliers|=this.Other.SCHWARZ; else h.multipliers&=~this.Other.SCHWARZ;if(h.cardpoints>89) h.multipliers|=this.Other.SCHNEIDER; else h.multipliers&=~this.Other.SCHNEIDER;if(h.multipliers&this.Other.SCHW_ANNC){ if(h.takealltricks) h.winlose=this.Win.WIN; else{h.winlose=this.Win.LOSE;h.multipliers|=this.Other.SCHWARZ|this.Other.SCHNEIDER;}} else if(h.multipliers&this.Other.SCHN_ANNC){ if(h.cardpoints>89) h.winlose=this.Win.WIN; else{h.winlose=this.Win.LOSE;h.multipliers|=this.Other.SCHNEIDER;}} if(!(h.multipliers&(this.Other.SCHW_ANNC|this.Other.SCHN_ANNC))){ h.winlose=(h.cardpoints>60?this.Win.WIN:this.Win.LOSE);} if(!(h.multipliers&(this.Other.SCHW_ANNC|this.Other.SCHN_ANNC))){ if(h.cardpoints<31) h.multipliers|=this.Other.SCHNEIDER;}h.overbid=0;let attempts=0;while(this.calculate_suit_grand_score(i)<h.bid&&attempts<20){h.overbid++;attempts++;}if(this.calculate_suit_grand_score(i)<h.bid) h.winlose=this.Win.LOSE;if(h.overbid>0) h.winlose=this.Win.LOSE;}calculate_hand_score(i){let h=this.hand[i];this.refreshBockFlags();h.bock=(this.bock_starts.some(start=>i>start&&i<=start+3))?this.Bock.BOCK:this.Bock.NO;h.score=[0,0,0,0]; if(h.contract===this.Contract.NULLL){let mult=h.multipliers;let base; if(mult===this.Other.OPEN) base=this.SCORE_NULL_OPEN; else if(mult===this.Other.HAND) base=this.SCORE_NULL_HAND; else if((mult&this.Other.OPEN)&&(mult&this.Other.HAND)) base=this.SCORE_NULL_HAND_OPEN; else base=this.SCORE_NULL_PLAIN; h.score[h.declarer]=h.bock*h.kontrare*h.winlose*base;} else{ if(h.contract!==this.Contract.RAMSCH){let base=this.calculate_suit_grand_score(i);h.score[h.declarer]=base*h.winlose*h.bock*h.kontrare;} else{ if(h.ramsch===this.RS.DURCHMARSCH) h.score[h.declarer]=h.bock*120; else{ for(let k=0;k<h.number_of_losers;k++){let li=h.loser[k]; if(typeof li==='number') h.score[li]=h.bock*h.cardpoints*h.ramsch; } } } } }calculate_game_score(){this.refreshBockFlags();this.total=[0,0,0,0];for(let i=0;i<=this.current;i++) for(let j=0;j<this.numPlayers;j++) this.total[j]+=this.hand[i].score[j]||0;}render(){let s="| # | Bid | M | Contract | HOSAZA | KR | "+pad(this.names[0],8)+" | "+pad(this.names[1],8)+" | "+pad(this.names[2],8); if(this.numPlayers===4) s+=" | "+pad(this.names[3],8); s+=" | Bock |\n"; s+="| -- | --- | - | -------- | ------ | -- | -------- | -------- | -------- |"+(this.numPlayers===4?" -------- |":" ---- |")+"\n"; for(let i=0;i<=this.current;i++){let h=this.hand[i];let row="| "+pad((i+1),2)+" | "+pad(h.bid||0,3)+" | "; if(h.contract===this.Contract.NULLL||h.contract===this.Contract.RAMSCH) row+="  | "; else row+=pad(h.matadors||0,1)+" | "; row+=pad(this.get_contract_name(h.contract),8)+" | "; if(h.contract===this.Contract.RAMSCH){ if(h.ramsch===this.RS.JUNGF) row+="JUNGF "; else if(h.ramsch===this.RS.DURCHMARSCH) row+="DURCH "; else row+="      "; } else{ row+=((h.multipliers&this.Other.HAND)?"H":" ")+((h.multipliers&this.Other.OPEN)?"O":" ")+((h.multipliers&this.Other.SCHNEIDER)?"S":" ")+((h.multipliers&this.Other.SCHN_ANNC)?"A":" ")+((h.multipliers&this.Other.SCHWARZ)?"Z":" ")+((h.multipliers&this.Other.SCHW_ANNC)?"A":" "); } row+=" | "; if(h.kontrare===this.KR.RE) row+="KR | "; else if(h.kontrare===this.KR.KONTRA) row+="K  | "; else row+="   | "; row+=pad(h.score[0]||0,8)+" | "+pad(h.score[1]||0,8)+" | "+pad(h.score[2]||0,8); if(this.numPlayers===4) row+=" | "+pad(h.score[3]||0,8); row+=" | "+(h.bock===this.Bock.BOCK?" B  ":"    ")+" |"; if(h.edited) row+=" ***"; s+=row+"\n";} s+="| -- | --- | - | -------- | ------ | -- | -------- | -------- | -------- |"+(this.numPlayers===4?" -------- |":" ---- |")+"\n"; s+="Totals: "+pad(this.total[0]||0,8)+" | "+pad(this.total[1]||0,8)+" | "+pad(this.total[2]||0,8); if(this.numPlayers===4) s+=" | "+pad(this.total[3]||0,8); return s;}get_contract_name(v){switch(v){case this.Contract.CLUBS:return"Clubs";case this.Contract.SPADES:return"Spades";case this.Contract.HEARTS:return"Hearts";case this.Contract.DIAMONDS:return"Diamonds";case this.Contract.NULLL:return"Null";case this.Contract.GRAND:return"Grand";case this.Contract.RAMSCH:return"Ramsch";default:return"?";}}}function pad(s,w){s=String(s);return s.length<w?" ".repeat(w-s.length)+s:s}let game=null;const out=document.getElementById('out');  document.getElementById('init').addEventListener('click',()=>{game=new G();game.numPlayers=parseInt(document.getElementById('players').value,10);for(let i=0;i<game.numPlayers;i++) game.names[i]=document.getElementById('n'+i).value||('P'+(i+1));game.hand=[game.make()];game.current=0;document.getElementById('hand').style.display='block';
  const setupFields = document.getElementById('setupFields'); if(setupFields){ setupFields.style.display='none'; }
  const initBtn = document.getElementById('init'); if(initBtn){ initBtn.style.display='none'; }
  rebuildDec();  // read house rules and apply to game  game.ramschonly = document.getElementById('ramsch').checked;
  game.rules.kontrare_allowed = document.getElementById('hr_kontrare').checked;
  game.rules.nobody_bids_18_play_ramsch = document.getElementById('hr_nobody_bids_18').checked;
  game.rules.ramschround_after_bockround = document.getElementById('hr_ramsch_after_bock').checked;
  game.rules.grand_hand_during_ramschround = document.getElementById('hr_grand_during_ramsch').checked;
  game.rules.bockround_for_60_60_tie = document.getElementById('hr_bock_60_60').checked;
  game.rules.bockround_for_120_hand_score = document.getElementById('hr_bock_120').checked;
  game.rules.bockround_for_lost_contra_or_rekontra = document.getElementById('hr_bock_lost_kontra').checked;
  game.rules.bockround_for_schneider = document.getElementById('hr_bock_schneider').checked;
  game.rules.bockround_for_schneider_only_if_not_bockround = document.getElementById('hr_bock_schneider_only_if_not_bock').checked;
  game.rules.bockround_max_one_per_hand = document.getElementById('hr_bock_max_one').checked;
  game.rules.bockround_if_two_rounds_without_bock = document.getElementById('hr_bock_two_rounds_without_bock').checked;
  // replace houseRules UI with a 3-column summary of the selected rules
  const hrDiv = document.getElementById('houseRules');
  if (hrDiv) {
    const sel = [];
    function addIf(cond, text){ if(cond) sel.push(text); }
    addIf(game.ramschonly, 'Ramsch-only');
    addIf(game.rules.kontrare_allowed, 'Kontra/Re allowed');
    addIf(game.rules.nobody_bids_18_play_ramsch, 'Play Ramsch if nobody bids 18');
    addIf(game.rules.ramschround_after_bockround, 'Ramsch round after Bock');
    addIf(game.rules.grand_hand_during_ramschround, 'Grand Hand allowed during Ramsch');
    addIf(game.rules.bockround_for_60_60_tie, 'Bock for 60/60 tie');
    addIf(game.rules.bockround_for_120_hand_score, 'Bock for 120 hand score');
    addIf(game.rules.bockround_for_lost_contra_or_rekontra, 'Bock for lost Kontra/Re');
    addIf(game.rules.bockround_for_schneider, 'Bock for Schneider');
    addIf(game.rules.bockround_for_schneider_only_if_not_bockround, 'Only create Schneider Bock if not already Bock');
    addIf(game.rules.bockround_max_one_per_hand, 'Max 1 Bock per hand');

  }
  // update hand header/info immediately (do not render scores table yet)
  const handTitleInit = document.getElementById('handTitle'); if(handTitleInit) handTitleInit.textContent = 'Hand '+ (game.current+1);
  const infoInit = document.getElementById('handInfo'); if(infoInit){ const dealerIndex = game.current % game.numPlayers; const dealer = game.names[dealerIndex] || ('P'+(dealerIndex+1)); const listens = game.names[(game.current+1)%game.numPlayers] || ('P'+(((game.current+1)%game.numPlayers)+1)); const speaks = game.names[(game.current+2)%game.numPlayers] || ('P'+(((game.current+2)%game.numPlayers)+1)); const leads = listens; let txt = 'Dealer: '+dealer+'\nSpeaks: '+speaks+'\nListens: '+listens+'\nLeads: '+leads; if(game.numPlayers===4){ const cont = game.names[(game.current+3)%game.numPlayers] || ('P'+(((game.current+3)%game.numPlayers)+1)); txt += '\nContinues: '+cont; } infoInit.textContent = txt; }
  // Set sensible defaults for the editor (Kontra/Re = None, Ramsch special = Plain, Contract = Ramsch)
  setRadioValue('ct', '12');

  document.getElementById('mH').checked = false; document.getElementById('mO').checked = false; document.getElementById('mS').checked = false; document.getElementById('mZ').checked = false;
  // hide Ramsch option and Ramsch special until bid is explicitly 0
  const rlbl = document.getElementById('ct_ramsch_lbl'); if(rlbl) rlbl.style.display='none'; const rsRow = document.getElementById('ramsch-special-row'); if(rsRow) rsRow.style.display='none'; const rsDiv = document.getElementById('rs'); if(rsDiv) rsDiv.style.display='none';
  // Do not render the score table yet — wait until at least one hand is scored
  document.getElementById('tableContainer').innerHTML = '<div class="muted">No scored hands yet</div>';
});document.getElementById('add').addEventListener('click',()=>{
  if(!game) return alert('Init first');

function renderTable(){
  const container = document.getElementById('tableContainer');
  if(!game) { container.innerHTML = '<div class="muted">No game initialized</div>'; return; }
  // build table
  let html = '<table><thead><tr>' +
    '<th>#</th><th>Bid</th><th>M</th><th>Contract</th><th>HOSAZA</th><th>KR</th>';
  for(let p=0;p<game.numPlayers;p++) html += '<th>'+escapeHtml(game.names[p]||('P'+(p+1)))+'</th>';
  html += '<th>Bock</th><th>Edited</th></tr></thead><tbody>';

  for(let i=0;i<=game.current;i++){
    const h = game.hand[i];
    let multip = '';
    if(h.contract===game.Contract.RAMSCH){
      if(h.ramsch===game.RS.JUNGF) multip = 'JUNGF';
      else if(h.ramsch===game.RS.DURCHMARSCH) multip = 'DURCH';
      else multip = '';
    } else {
      multip = (h.multipliers&game.Other.HAND? 'H':'') + (h.multipliers&game.Other.OPEN? 'O':'') + (h.multipliers&game.Other.SCHNEIDER? 'S':'') + (h.multipliers&game.Other.SCHN_ANNC? 'A':'') + (h.multipliers&game.Other.SCHWARZ? 'Z':'') + (h.multipliers&game.Other.SCHW_ANNC? 'A':'');
    }
    let kr = '';
    if(h.kontrare===game.KR.RE) kr='KR'; else if(h.kontrare===game.KR.KONTRA) kr='K';
    html += '<tr>' +
      '<td>'+(i+1)+'</td>' +
      '<td>'+(h.bid||0)+'</td>' +
      '<td>'+(h.matadors||'')+'</td>' +
      '<td>'+escapeHtml(game.get_contract_name(h.contract))+'</td>' +
      '<td>'+escapeHtml(multip)+'</td>' +
      '<td>'+kr+'</td>';
    for(let p=0;p<game.numPlayers;p++) html += '<td>'+ (h.score[p]||0) +'</td>';
    html += '<td>'+(h.bock===game.Bock.BOCK? 'B':'')+'</td>' +
            '<td>'+(h.edited? '***':'')+'</td>' +
            '</tr>';
  }
  // totals
  html += '<tr><td colspan="6" style="text-align:right;font-weight:600">Totals:</td>';
  for(let p=0;p<game.numPlayers;p++) html += '<td style="font-weight:600">'+(game.total[p]||0)+'</td>';
  html += '<td colspan="2"></td></tr>';

  html += '</tbody></table>';
  container.innerHTML = html;
}

function exportCsv(){
  if(!game) return alert('Initialize game first');
  const rows = [];
  // header
  const header = ['#','Bid','M','Contract','HOSAZA','KR'].concat(game.names.slice(0,game.numPlayers)).concat(['Bock','Edited']);
  rows.push(header.map(f=>'"'+String(f).replace(/"/g,'""')+'"').join(','));
  for(let i=0;i<=game.current;i++){
    const h = game.hand[i];
    let multip = '';
    if(h.contract===game.Contract.RAMSCH){
      if(h.ramsch===game.RS.JUNGF) multip='JUNGF'; else if(h.ramsch===game.RS.DURCHMARSCH) multip='DURCH';
    } else {
      multip = (h.multipliers&game.Other.HAND? 'H':'') + (h.multipliers&game.Other.OPEN? 'O':'') + (h.multipliers&game.Other.SCHNEIDER? 'S':'') + (h.multipliers&game.Other.SCHN_ANNC? 'A':'') + (h.multipliers&game.Other.SCHWARZ? 'Z':'') + (h.multipliers&game.Other.SCHW_ANNC? 'A':'');
    }
    let kr = '';
    if(h.kontrare===game.KR.RE) kr='KR'; else if(h.kontrare===game.KR.KONTRA) kr='K';
    const r = [i+1,h.bid||0,h.matadors||'',game.get_contract_name(h.contract),multip,kr];
    for(let p=0;p<game.numPlayers;p++) r.push(h.score[p]||0);
    r.push(h.bock===game.Bock.BOCK? 'B':''); r.push(h.edited? '***':'');
    rows.push(r.map(f=>'"'+String(f).replace(/"/g,'""')+'"').join(','));
  }
  // totals row
  const totals = ['Totals','','','','',''].concat(game.total.slice(0,game.numPlayers)).concat(['','']);
  rows.push(totals.map(f=>'"'+String(f).replace(/"/g,'""')+'"').join(','));

  const csv = rows.join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'skat_scoresheet.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

document.getElementById('exportCsv').addEventListener('click', exportCsv);

// Game control buttons handlers
const endBtn = document.getElementById('endGameBtn');
const newBtn = document.getElementById('newGameBtn');
const addBockBtn = document.getElementById('addBockBtn');
const gameStatusDiv = document.getElementById('gameStatus');

if(endBtn){ endBtn.addEventListener('click', ()=>{
  if(!game) return alert('Init first');
  game.calculate_game_score();
  render();
  // hide the hand editor to prevent further edits
  const handDiv = document.getElementById('hand'); if(handDiv) handDiv.style.display='none';
  // determine winner
  const totals = (game.total||[]).slice(0, game.numPlayers);
  let msg = 'Game ended.';
  if(totals.length>0){
    const max = Math.max.apply(null, totals);
    const winners = [];
    for(let i=0;i<totals.length;i++) if(totals[i]===max) winners.push(i);
    if(winners.length===1){
      const name = game.names[winners[0]] || ('P'+(winners[0]+1));
      msg = 'Game ended. Winner: '+name+' with score of '+max;
    } else {
      const names = winners.map(i=> game.names[i]||('P'+(i+1))).join(', ');
      msg = 'Game ended. Tie between: '+names+' with score '+max;
    }
  }
  if(gameStatusDiv) gameStatusDiv.textContent = msg;
}); }

if(newBtn){ newBtn.addEventListener('click', ()=>{
  // Reload page to reset everything
  if(confirm('Start a new game? This will discard current game.')) location.reload();
}); }

if(addBockBtn){ addBockBtn.addEventListener('click', ()=>{
  if(!game) return alert('Init first');
  game.bock_count = (game.bock_count || 0) + 1;
  game.markNextBockRound(game.current);
  game.calculate_game_score();
  if(gameStatusDiv) gameStatusDiv.textContent = 'Bock round created: the next 3 hands will be played as Bock; the current hand is unaffected.';
  render();
}); }

    }
  });
